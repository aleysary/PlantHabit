name: verdant
description: "Verdant — grow a virtual garden by keeping your habits."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.19.0
  share_plus: ^10.1.4
  # Firebase (see docs/FIREBASE.md). Uncomment after running `flutterfire configure`.
  # firebase_core: ^3.6.0
  # firebase_auth: ^5.3.1
  # cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pots/
    - assets/plants/aloe/
    - assets/plants/bird_of_paradise/
    - assets/plants/bonsai/
    - assets/plants/cactus/
    - assets/plants/calathea/
    - assets/plants/cherry_blossom/
    - assets/plants/echeveria/
    - assets/plants/fern/
    - assets/plants/fiddle_leaf/
    - assets/plants/lavender/
    - assets/plants/lucky_bamboo/
    - assets/plants/monstera/
    - assets/plants/olive/
    - assets/plants/peace_lily/
    - assets/plants/pothos/
    - assets/plants/rose/
    - assets/plants/snake_plant/
    - assets/plants/sunflower/
    - assets/plants/tulip/
